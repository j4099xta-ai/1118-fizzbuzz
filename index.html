<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FizzBuzz (1〜50)</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);

      --color-fizz: #0284c7;
      --bg-fizz: #e0f2fe;
      --border-fizz: #7dd3fc;

      --color-buzz: #16a34a;
      --bg-buzz: #dcfce7;
      --border-buzz: #86efac;

      --color-fizzbuzz: #9333ea;
      --bg-fizzbuzz: #f3e8ff;
      --border-fizzbuzz: #d8b4fe;

      --color-number: #475569;
      --bg-number: #f1f5f9;
      --border-number: #cbd5e1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;

        --color-fizz: #38bdf8;
        --bg-fizz: rgba(56, 189, 248, 0.15);
        --border-fizz: rgba(56, 189, 248, 0.4);

        --color-buzz: #4ade80;
        --bg-buzz: rgba(74, 222, 128, 0.15);
        --border-buzz: rgba(74, 222, 128, 0.4);

        --color-fizzbuzz: #c084fc;
        --bg-fizzbuzz: rgba(192, 132, 252, 0.18);
        --border-fizzbuzz: rgba(192, 132, 252, 0.4);

        --color-number: #cbd5e1;
        --bg-number: rgba(203, 213, 225, 0.08);
        --border-number: #334155;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #0284c7, #9333ea, #16a34a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    .summary-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .summary-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.375rem 0.875rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .summary-badge.all { border-color: var(--border-color); color: var(--text-muted); }
    .summary-badge.fizzbuzz { border-color: var(--border-fizzbuzz); color: var(--color-fizzbuzz); background: var(--bg-fizzbuzz); }
    .summary-badge.fizz { border-color: var(--border-fizz); color: var(--color-fizz); background: var(--bg-fizz); }
    .summary-badge.buzz { border-color: var(--border-buzz); color: var(--color-buzz); background: var(--bg-buzz); }
    .summary-badge.number { border-color: var(--border-number); color: var(--color-number); background: var(--bg-number); }

    .summary-badge span {
      margin-left: 0.35rem;
      padding: 0.1rem 0.45rem;
      border-radius: 9999px;
      background: rgba(0, 0, 0, 0.08);
      font-size: 0.75rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 0.875rem;
      padding: 1.25rem 0.75rem;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .card-num {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .card-val {
      font-size: 1.15rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 0.5rem;
      display: inline-block;
      width: 100%;
      word-break: break-word;
    }

    .card.fizzbuzz {
      border-color: var(--border-fizzbuzz);
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--bg-fizzbuzz) 100%);
    }
    .card.fizzbuzz .card-val {
      color: var(--color-fizzbuzz);
      background: var(--bg-fizzbuzz);
    }

    .card.fizz {
      border-color: var(--border-fizz);
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--bg-fizz) 100%);
    }
    .card.fizz .card-val {
      color: var(--color-fizz);
      background: var(--bg-fizz);
    }

    .card.buzz {
      border-color: var(--border-buzz);
      background: linear-gradient(180deg, var(--card-bg) 0%, var(--bg-buzz) 100%);
    }
    .card.buzz .card-val {
      color: var(--color-buzz);
      background: var(--bg-buzz);
    }

    .card.number {
      border-color: var(--border-color);
    }
    .card.number .card-val {
      color: var(--color-number);
      background: var(--bg-number);
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding-top: 3rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>FizzBuzz (1〜50)</h1>
      <p class="description">1から50までの数値を判定し、3の倍数を Fizz、5の倍数を Buzz、両方の倍数を FizzBuzz と表示します。</p>
      <div id="summary" class="summary-bar"></div>
    </header>

    <main>
      <div id="fizzbuzz-grid" class="grid"></div>
    </main>

    <footer>
      <p>1118-fizzbuzz &copy; 2026</p>
    </footer>
  </div>

  <script>
    function getFizzBuzzResult(n) {
      if (n % 15 === 0) {
        return { type: 'fizzbuzz', text: 'FizzBuzz' };
      } else if (n % 3 === 0) {
        return { type: 'fizz', text: 'Fizz' };
      } else if (n % 5 === 0) {
        return { type: 'buzz', text: 'Buzz' };
      } else {
        return { type: 'number', text: String(n) };
      }
    }

    function renderFizzBuzz(min = 1, max = 50) {
      const grid = document.getElementById('fizzbuzz-grid');
      const summary = document.getElementById('summary');
      const fragment = document.createDocumentFragment();

      const counts = {
        total: max - min + 1,
        fizzbuzz: 0,
        fizz: 0,
        buzz: 0,
        number: 0
      };

      for (let i = min; i <= max; i++) {
        const item = getFizzBuzzResult(i);
        counts[item.type]++;

        const card = document.createElement('div');
        card.className = `card ${item.type}`;

        const numEl = document.createElement('span');
        numEl.className = 'card-num';
        numEl.textContent = `#${i}`;

        const valEl = document.createElement('span');
        valEl.className = 'card-val';
        valEl.textContent = item.text;

        card.appendChild(numEl);
        card.appendChild(valEl);
        fragment.appendChild(card);
      }

      grid.innerHTML = '';
      grid.appendChild(fragment);

      summary.innerHTML = `
        <div class="summary-badge all">全体: <span>${counts.total}</span></div>
        <div class="summary-badge fizzbuzz">FizzBuzz: <span>${counts.fizzbuzz}</span></div>
        <div class="summary-badge fizz">Fizz: <span>${counts.fizz}</span></div>
        <div class="summary-badge buzz">Buzz: <span>${counts.buzz}</span></div>
        <div class="summary-badge number">数値: <span>${counts.number}</span></div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderFizzBuzz(1, 50);
    });
  </script>
</body>
</html>
